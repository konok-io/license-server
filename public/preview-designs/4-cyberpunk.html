<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Style - MRH License</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --neon-green: #39ff14;
            --neon-pink: #ff0080;
            --neon-cyan: #00f0ff;
            --neon-yellow: #ffe600;
            --text-primary: #ffffff;
            --text-secondary: #888;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Cyber Grid Background */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        
        /* Neon Glow Lines */
        .glow-line {
            position: fixed;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
            width: 100%;
            animation: glowScan 4s linear infinite;
            box-shadow: 0 0 20px var(--neon-green);
        }
        
        .glow-line:nth-child(2) {
            top: auto;
            bottom: 0;
            background: linear-gradient(90deg, transparent, var(--neon-pink), transparent);
            box-shadow: 0 0 20px var(--neon-pink);
            animation-delay: -2s;
        }
        
        @keyframes glowScan {
            0% { top: -2px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        
        /* Main Container */
        .cyber-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
        }
        
        /* Cyber Panel */
        .cyber-panel {
            background: rgba(10, 10, 15, 0.95);
            border: 2px solid var(--neon-green);
            border-radius: 0;
            position: relative;
            box-shadow: 
                0 0 30px rgba(57, 255, 20, 0.2),
                inset 0 0 60px rgba(57, 255, 20, 0.05);
        }
        
        /* Corner Decorations */
        .cyber-panel::before,
        .cyber-panel::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid var(--neon-pink);
        }
        
        .cyber-panel::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }
        
        .cyber-panel::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }
        
        /* Header */
        .cyber-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--neon-green);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(57, 255, 20, 0.05);
        }
        
        .cyber-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--neon-green) 0%, var(--neon-cyan) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        
        .logo-icon svg {
            width: 28px;
            height: 28px;
            color: var(--bg-primary);
        }
        
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            letter-spacing: 2px;
        }
        
        .logo-sub {
            font-size: 0.65rem;
            color: var(--text-secondary);
            letter-spacing: 3px;
        }
        
        .cyber-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: rgba(255, 0, 128, 0.1);
            border: 1px solid var(--neon-pink);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            animation: statusBlink 1s ease-in-out infinite;
        }
        
        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .status-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: var(--neon-pink);
            letter-spacing: 2px;
        }
        
        /* Title Section */
        .cyber-title-section {
            padding: 30px 25px;
            text-align: center;
            border-bottom: 1px solid rgba(57, 255, 20, 0.3);
            background: linear-gradient(180deg, rgba(57, 255, 20, 0.02) 0%, transparent 100%);
        }
        
        .cyber-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--neon-cyan);
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }
        
        .cyber-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .cyber-title .highlight {
            color: var(--neon-green);
            text-shadow: 0 0 20px var(--neon-green);
        }
        
        .cyber-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        /* Neon Frame */
        .neon-frame {
            padding: 25px;
            border: 1px solid rgba(57, 255, 20, 0.2);
            margin: 0 25px;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .neon-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
            animation: frameGlow 2s ease-in-out infinite;
        }
        
        @keyframes frameGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        /* Form */
        .cyber-form {
            margin-top: 0;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .cyber-label-input {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: var(--neon-green);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .cyber-label-input::before {
            content: '>';
            color: var(--neon-pink);
        }
        
        .cyber-input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 10px rgba(0, 240, 255, 0.1),
                inset 0 0 30px rgba(0, 240, 255, 0.05);
        }
        
        .cyber-input::placeholder {
            color: rgba(0, 240, 255, 0.3);
            letter-spacing: 2px;
        }
        
        .cyber-input:focus {
            outline: none;
            border-color: var(--neon-green);
            box-shadow: 
                0 0 20px rgba(57, 255, 20, 0.3),
                inset 0 0 30px rgba(57, 255, 20, 0.05);
        }
        
        /* Submit Button */
        .cyber-submit {
            width: 100%;
            padding: 18px;
            background: transparent;
            border: 2px solid var(--neon-green);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--neon-green);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease;
        }
        
        .cyber-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
            transition: left 0.5s ease;
        }
        
        .cyber-submit:hover::before {
            left: 100%;
        }
        
        .cyber-submit:hover {
            background: var(--neon-green);
            color: var(--bg-primary);
            box-shadow: 
                0 0 30px var(--neon-green),
                0 0 60px rgba(57, 255, 20, 0.3);
        }
        
        /* Tech Details */
        .tech-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(57, 255, 20, 0.2);
        }
        
        .tech-item {
            text-align: center;
            padding: 10px 5px;
            background: rgba(57, 255, 20, 0.05);
            border: 1px solid rgba(57, 255, 20, 0.1);
        }
        
        .tech-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--neon-cyan);
            margin-bottom: 4px;
        }
        
        .tech-label {
            font-size: 0.6rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        /* Footer */
        .cyber-footer {
            padding: 15px 25px;
            border-top: 1px solid var(--neon-pink);
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 0, 128, 0.05);
        }
        
        .footer-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            color: var(--neon-pink);
            letter-spacing: 2px;
        }
        
        .footer-version {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }
        
        @media (max-width: 480px) {
            .cyber-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .cyber-title {
                font-size: 1.5rem;
            }
            
            .neon-frame {
                margin: 0 15px;
            }
            
            .tech-details {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="glow-line"></div>
    <div class="glow-line"></div>
    
    <div class="cyber-container">
        <div class="cyber-panel">
            <div class="cyber-header">
                <div class="cyber-logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <div>
                        <div class="logo-text">MRH LICENSE</div>
                        <div class="logo-sub">ACTIVATION SYSTEM</div>
                    </div>
                </div>
                <div class="cyber-status">
                    <div class="status-dot"></div>
                    <span class="status-text">AWAITING</span>
                </div>
            </div>
            
            <div class="cyber-title-section">
                <div class="cyber-label">// SYSTEM_READY</div>
                <h1 class="cyber-title">LICENSE <span class="highlight">KEY</span> INPUT</h1>
                <p class="cyber-subtitle">Enter your activation key to initialize protection</p>
            </div>
            
            <div class="neon-frame">
                <form class="cyber-form" onsubmit="event.preventDefault(); alert('Cyberpunk Design - Preview Mode!');">
                    <div class="input-group">
                        <label class="cyber-label-input">LICENSE_KEY</label>
                        <input type="text" class="cyber-input" placeholder="XXXX-XXXX-XXXX-XXXX">
                    </div>
                    
                    <button type="submit" class="cyber-submit">
                        ⚡ INITIATE ACTIVATION ⚡
                    </button>
                </form>
                
                <div class="tech-details">
                    <div class="tech-item">
                        <div class="tech-value">4096</div>
                        <div class="tech-label">RSA Bits</div>
                    </div>
                    <div class="tech-item">
                        <div class="tech-value">24H</div>
                        <div class="tech-label">Cache TTL</div>
                    </div>
                    <div class="tech-item">
                        <div class="tech-value">7D</div>
                        <div class="tech-label">Grace</div>
                    </div>
                    <div class="tech-item">
                        <div class="tech-value">v2.0</div>
                        <div class="tech-label">Protocol</div>
                    </div>
                </div>
            </div>
            
            <div class="cyber-footer">
                <span class="footer-text">◄ SECURE CONNECTION ESTABLISHED ►</span>
                <span class="footer-version">SYS.2.0.0</span>
            </div>
        </div>
    </div>
    
    <script>
        document.querySelector('.cyber-input').addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            let formatted = '';
            for (let i = 0; i < value.length && i < 16; i++) {
                if (i > 0 && i % 4 === 0) formatted += '-';
                formatted += value[i];
            }
            e.target.value = formatted;
        });
    </script>
</body>
</html>
