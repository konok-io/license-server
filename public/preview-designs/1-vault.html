<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Style - MRH License</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a14;
            --bg-secondary: #0f0f1a;
            --accent-gold: #f5b544;
            --accent-gold-dark: #d4980e;
            --accent-blue: #667eea;
            --accent-green: #22c55e;
            --text-primary: #ffffff;
            --text-secondary: #8888aa;
            --border-color: rgba(245, 181, 68, 0.2);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated background */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(245, 181, 68, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245, 181, 68, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }
        
        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 181, 68, 0.1) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: pulse 4s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }
        
        /* Vault Container */
        .vault-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }
        
        .vault-frame {
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 
                0 0 60px rgba(245, 181, 68, 0.1),
                0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        /* Vault Header */
        .vault-header {
            background: linear-gradient(90deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%);
            padding: 3px 0;
        }
        
        .vault-header-bar {
            background: #0a0a14;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .vault-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .vault-title svg {
            color: var(--accent-gold);
        }
        
        .security-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--accent-green);
            font-weight: 600;
        }
        
        .security-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* Vault Body */
        .vault-body {
            padding: 40px 30px;
        }
        
        /* Vault Icon */
        .vault-icon-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .vault-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 20px 40px rgba(245, 181, 68, 0.3),
                0 0 60px rgba(245, 181, 68, 0.2);
            position: relative;
        }
        
        .vault-icon svg {
            width: 50px;
            height: 50px;
            color: #0a0a14;
        }
        
        .vault-icon::before {
            content: '';
            position: absolute;
            inset: -4px;
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            animation: rotate 10s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .vault-icon::after {
            content: '';
            position: absolute;
            inset: -15px;
            border: 1px dashed rgba(245, 181, 68, 0.3);
            border-radius: 50%;
            animation: rotate 20s linear infinite reverse;
        }
        
        /* Title Section */
        .vault-title-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .vault-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent-gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .vault-heading {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        
        .vault-subheading {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        /* Vault Door Animation */
        .vault-door-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            padding: 12px;
            background: rgba(245, 181, 68, 0.05);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
        }
        
        .vault-door-indicator svg {
            width: 18px;
            height: 18px;
            color: var(--accent-gold);
        }
        
        .vault-door-indicator span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .vault-door-indicator .status {
            color: var(--accent-green);
            font-weight: 600;
        }
        
        /* Form */
        .vault-form {
            margin-top: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-label svg {
            width: 14px;
            height: 14px;
            color: var(--accent-gold);
            margin-right: 6px;
            vertical-align: middle;
        }
        
        .form-input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        
        .form-input::placeholder {
            color: rgba(136, 136, 170, 0.5);
            text-transform: none;
            letter-spacing: 1px;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 4px rgba(245, 181, 68, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }
        
        /* Submit Button */
        .vault-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%);
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #0a0a14;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .vault-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(245, 181, 68, 0.4);
        }
        
        .vault-submit svg {
            width: 20px;
            height: 20px;
        }
        
        /* Security Features */
        .security-features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--border-color);
        }
        
        .security-feature {
            text-align: center;
            padding: 12px 8px;
            background: rgba(245, 181, 68, 0.05);
            border-radius: 10px;
        }
        
        .security-feature svg {
            width: 24px;
            height: 24px;
            color: var(--accent-gold);
            margin-bottom: 6px;
        }
        
        .security-feature span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        /* Footer */
        .vault-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .vault-footer strong {
            color: var(--accent-gold);
        }
        
        @media (max-width: 480px) {
            .vault-body {
                padding: 30px 20px;
            }
            
            .vault-heading {
                font-size: 1.5rem;
            }
            
            .security-features {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="glow-orb"></div>
    
    <div class="vault-container">
        <div class="vault-frame">
            <div class="vault-header">
                <div class="vault-header-bar">
                    <div class="vault-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        MRH License Vault
                    </div>
                    <div class="security-badge">ENCRYPTED</div>
                </div>
            </div>
            
            <div class="vault-body">
                <div class="vault-icon-container">
                    <div class="vault-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="7.5" cy="15.5" r="5"/>
                            <path d="M21 2l-9.6 9.6"/>
                            <path d="M15.5 7.5l3 3"/>
                            <path d="M18 5l3 3"/>
                        </svg>
                    </div>
                </div>
                
                <div class="vault-title-section">
                    <div class="vault-label">// Secure Activation</div>
                    <h1 class="vault-heading">Unlock Your License</h1>
                    <p class="vault-subheading">Enter your license key to unlock the vault and activate your installation.</p>
                </div>
                
                <div class="vault-door-indicator">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <span>Vault Status: <span class="status">LOCKED</span></span>
                </div>
                
                <form class="vault-form" onsubmit="event.preventDefault(); alert('Vault Design - Preview Mode!');">
                    <div class="form-group">
                        <label class="form-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                            </svg>
                            License Key
                        </label>
                        <input type="text" class="form-input" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19">
                    </div>
                    
                    <button type="submit" class="vault-submit">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        Unlock Vault
                    </button>
                </form>
                
                <div class="security-features">
                    <div class="security-feature">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                        <span>RSA-4096</span>
                    </div>
                    <div class="security-feature">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
                        </svg>
                        <span>Domain Bound</span>
                    </div>
                    <div class="security-feature">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12,6 12,12 16,14"/>
                        </svg>
                        <span>24h Cache</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="vault-footer">
            Protected by <strong>MRH License System</strong>
        </div>
    </div>
    
    <script>
        // Format license key with dashes
        document.querySelector('.form-input').addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            let formatted = '';
            for (let i = 0; i < value.length && i < 16; i++) {
                if (i > 0 && i % 4 === 0) formatted += '-';
                formatted += value[i];
            }
            e.target.value = formatted;
        });
    </script>
</body>
</html>
