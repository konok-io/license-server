<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shield Style - MRH License</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0c0c14;
            --bg-card: #12121c;
            --accent-gold: #f5a623;
            --accent-blue: #4f8cff;
            --accent-green: #4ade80;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --border-color: rgba(245, 166, 35, 0.2);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        /* Background decoration */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        
        .bg-circle {
            position: absolute;
            border: 1px solid rgba(245, 166, 35, 0.1);
            border-radius: 50%;
        }
        
        .bg-circle:nth-child(1) {
            width: 600px;
            height: 600px;
            top: -200px;
            right: -200px;
            animation: float 20s ease-in-out infinite;
        }
        
        .bg-circle:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            animation: float 15s ease-in-out infinite reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }
        
        /* Main Container */
        .shield-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
        }
        
        /* Card Frame */
        .shield-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 100px rgba(245, 166, 35, 0.05);
        }
        
        /* Top Banner */
        .shield-banner {
            background: linear-gradient(135deg, 
                rgba(245, 166, 35, 0.1) 0%, 
                rgba(79, 140, 255, 0.1) 50%,
                rgba(74, 222, 128, 0.1) 100%);
            padding: 25px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }
        
        /* Shield Icon */
        .shield-icon-wrapper {
            position: relative;
            width: 120px;
            height: 140px;
            margin: 0 auto 20px;
        }
        
        .shield-icon {
            position: relative;
            z-index: 1;
        }
        
        .shield-icon svg {
            width: 100px;
            height: 120px;
            color: var(--accent-gold);
            filter: drop-shadow(0 10px 30px rgba(245, 166, 35, 0.3));
        }
        
        .shield-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(245, 166, 35, 0.2) 0%, transparent 70%);
            animation: shieldPulse 3s ease-in-out infinite;
        }
        
        @keyframes shieldPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }
        
        .shield-brand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent-gold);
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        
        .shield-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .shield-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        /* Protection Status */
        .protection-status {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .status-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        
        .status-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid transparent;
        }
        
        .status-item.active {
            border-color: rgba(74, 222, 128, 0.3);
            background: rgba(74, 222, 128, 0.05);
        }
        
        .status-item.pending {
            border-color: rgba(245, 166, 35, 0.3);
            background: rgba(245, 166, 35, 0.05);
        }
        
        .status-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .status-icon.active {
            background: rgba(74, 222, 128, 0.2);
            color: var(--accent-green);
        }
        
        .status-icon.pending {
            background: rgba(245, 166, 35, 0.2);
            color: var(--accent-gold);
        }
        
        .status-icon svg {
            width: 18px;
            height: 18px;
        }
        
        .status-info {
            flex: 1;
        }
        
        .status-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        
        .status-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-badge.active {
            background: rgba(74, 222, 128, 0.2);
            color: var(--accent-green);
        }
        
        .status-badge.pending {
            background: rgba(245, 166, 35, 0.2);
            color: var(--accent-gold);
        }
        
        /* Form Section */
        .shield-form-section {
            padding: 25px;
        }
        
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }
        
        .shield-input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        
        .shield-input::placeholder {
            color: rgba(245, 166, 35, 0.3);
            text-transform: none;
            letter-spacing: 1px;
        }
        
        .shield-input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.1);
        }
        
        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-gold);
            opacity: 0.5;
        }
        
        .input-icon svg {
            width: 20px;
            height: 20px;
        }
        
        /* Submit Button */
        .shield-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #e09600 100%);
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #0c0c14;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .shield-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(245, 166, 35, 0.4);
        }
        
        .shield-submit svg {
            width: 20px;
            height: 20px;
        }
        
        /* Footer */
        .shield-footer {
            padding: 15px 25px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .footer-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .footer-item svg {
            width: 14px;
            height: 14px;
            color: var(--accent-gold);
        }
        
        @media (max-width: 480px) {
            .shield-form-section {
                padding: 20px;
            }
            
            .protection-status {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-decoration">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>
    
    <div class="shield-container">
        <div class="shield-card">
            <div class="shield-banner">
                <div class="shield-icon-wrapper">
                    <div class="shield-glow"></div>
                    <div class="shield-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                    </div>
                </div>
                <div class="shield-brand">MRH LICENSE</div>
                <h1 class="shield-title">Activate Protection</h1>
                <p class="shield-subtitle">Secure your installation with a valid license key</p>
            </div>
            
            <div class="protection-status">
                <div class="status-title">Security Features</div>
                <div class="status-list">
                    <div class="status-item pending">
                        <div class="status-icon pending">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="7.5" cy="15.5" r="5"/>
                                <path d="M21 2l-9.6 9.6"/>
                            </svg>
                        </div>
                        <div class="status-info">
                            <div class="status-name">License Key</div>
                            <div class="status-desc">Not activated</div>
                        </div>
                        <span class="status-badge pending">Pending</span>
                    </div>
                    <div class="status-item active">
                        <div class="status-icon active">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            </svg>
                        </div>
                        <div class="status-info">
                            <div class="status-name">RSA-4096 Encryption</div>
                            <div class="status-desc">Active protection</div>
                        </div>
                        <span class="status-badge active">Active</span>
                    </div>
                    <div class="status-item active">
                        <div class="status-icon active">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83"/>
                            </svg>
                        </div>
                        <div class="status-info">
                            <div class="status-name">Domain Binding</div>
                            <div class="status-desc">your-app.com</div>
                        </div>
                        <span class="status-badge active">Bound</span>
                    </div>
                </div>
            </div>
            
            <div class="shield-form-section">
                <form onsubmit="event.preventDefault(); alert('Shield Design - Preview Mode!');">
                    <label class="form-label">License Key</label>
                    <div class="form-input-wrapper">
                        <input type="text" class="shield-input" placeholder="XXXX-XXXX-XXXX-XXXX">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </div>
                    </div>
                    
                    <button type="submit" class="shield-submit">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                        Activate Protection
                    </button>
                </form>
            </div>
            
            <div class="shield-footer">
                <div class="footer-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12,6 12,12 16,14"/>
                    </svg>
                    24h Cache
                </div>
                <div class="footer-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v4m0 12v4"/>
                        <path d="M4.93 4.93l2.83 2.83"/>
                    </svg>
                    7-Day Grace
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.querySelector('.shield-input').addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            let formatted = '';
            for (let i = 0; i < value.length && i < 16; i++) {
                if (i > 0 && i % 4 === 0) formatted += '-';
                formatted += value[i];
            }
            e.target.value = formatted;
        });
    </script>
</body>
</html>
